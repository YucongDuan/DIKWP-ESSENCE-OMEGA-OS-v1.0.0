name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python -m essence_omega_os suite --examples examples --output outputs/ci
      - run: PYTHONPATH=src python -m essence_omega_os verify outputs/ci/01_minimal_causal_kernel/evidence_ledger.jsonl
