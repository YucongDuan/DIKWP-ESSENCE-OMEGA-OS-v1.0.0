name: Expand complete source tree

on:
  push:
    branches:
      - main
    paths:
      - source-archive.zip

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expand prepared source archive
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          unzip -q source-archive.zip -d "$stage"
          cp -a "$stage"/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Expand complete project source tree"
          git push
